[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-diet"
version = "0.1.0"
authors = [
    { name="Varun Dawda" }
]
description = "A structural syntax utility to detect and clean up repetitive AI-generated code bloat."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/vd1686/ai-diet"

[tool.hatch.build.targets.wheel]
packages = ["ai_diet"]
