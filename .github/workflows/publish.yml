name: Publish to PyPI

on:
  # This lets you trigger the workflow manually from the GitHub Actions tab
  workflow_dispatch:
  # This triggers the workflow automatically when you create a new Release on GitHub
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Build and publish Python package
    runs-on: ubuntu-latest
    
    # These permissions are required for PyPI Trusted Publishing (OIDC)
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: python -m pip install --upgrade pip build

      - name: Build the package (sdist and wheel)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
